[project]
name = "ds-aa-tracking"
version = "0.1.0"
description = "OCHA anticipatory action portfolio tracking: schema, ingestion, and review site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyxlsb>=1.0",
    "ocha-stratus>=0.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "jinja2>=3.1",
    "pycountry>=23.12",
    "pyyaml>=6.0",
    "markdown>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_aa_tracking"]

[tool.ruff]
line-length = 99

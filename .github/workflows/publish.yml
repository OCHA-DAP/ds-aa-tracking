# Rebuild and publish the site so it never drifts from the database.
# Runs nightly, on every push to main that touches the build, by hand, and on a
# `data-updated` repository_dispatch. (`kb-updated` is still accepted for compatibility,
# but since the KB flip of 2026-09-28 the knowledge base is not a source: the build reads
# only the database snapshot.)
#
# Data path (2026-09-24): the dev DB is losing public network access, so this job never
# talks to it. The Databricks job `AA Tracking Nightly` (databricks.yml, 03:30 UTC)
# snapshots the whole `aa` schema to the dev blob; this workflow restores that snapshot
# into a throwaway Postgres service container and builds against localhost. The build
# scripts are unchanged — the stratus env vars just point at the container.
#
# "Publish changes" on the admin page (D164) starts this by hand with fresh_snapshot: the
# Databricks job then copies the database first (scripts/fresh_snapshot.py), so an edit made
# minutes ago is on the site about 15 minutes later instead of the next morning.
#
# Deploy (2026-11-03, D195): the built site is uploaded as the Pages artifact and deployed by
# actions/deploy-pages (Pages in workflow mode); it is never committed. Until then every publish
# committed the whole re-encrypted site to gh-pages, ~6 GB of history in six weeks, and the
# checkout fetched all of it. The checkout is main's tip only: nothing here reads history.
# The admin page's "Publish changes" button (proxy/server.js) finds runs by this file, the
# run-name below and the step names of the FIRST job: keep them. To publish again, start a new
# run (gh workflow run publish.yml) rather than re-running one: its site package is kept a day.
# Only main may deploy (the github-pages environment's branch policy).
#
# Two builds, one site (D203, 2026-11-09): the development and admin sites (dev/, admin/) are built
# from main, the open site at the root from the `prod` branch, both from the same snapshot, and put
# together by scripts/assemble_site.py. A merge to main changes dev/ only; the open site changes
# when `prod` moves (.github/workflows/promote.yml: "put it live"), and its data every night like
# the rest. When prod and main are the same commit there is one build. A pull request runs this
# workflow as its check (.github/workflows/check.yml): one build, never deployed.
name: Publish site
# the proxy's GET /publish tells a button run by this name; other runs keep GitHub's default
run-name: ${{ inputs.fresh_snapshot && 'Publish changes (a fresh copy of the database)' || '' }}

on:
  schedule:
    - cron: "17 4 * * *"          # daily, 04:17 UTC (snapshot lands 03:30 UTC)
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot to build from: latest or YYYY-MM-DD"
        default: latest
      fresh_snapshot:
        description: "Have Databricks copy the database first (the admin page's Publish changes)"
        type: boolean
        default: false
  repository_dispatch:
    types: [kb-updated, data-updated]
  push:
    branches: [main]
    paths: ["scripts/**", "src/**", "site_src/**", ".github/workflows/publish.yml"]
  workflow_call:       # a pull request's check (check.yml): build and check, no deploy

# main's runs queue one at a time (a newer waiting run replaces an older waiting one); a branch's
# or a pull request's build waits in a queue of its own, so it never displaces a publish
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'publish-site' || format('check-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read     # the build job: nothing it runs can deploy or write to the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # the throwaway Postgres above, through the usual stratus variables
      DSCI_AZ_DB_DEV_HOST: localhost
      DSCI_AZ_DB_DEV_UID: postgres
      DSCI_AZ_DB_DEV_PW: postgres
      DSCI_AZ_DB_DEV_UID_WRITE: postgres
      DSCI_AZ_DB_DEV_PW_WRITE: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # the copy runs on Databricks while the steps below set up; "Wait for…" joins it
      - name: Start a fresh copy of the database (Databricks)
        id: copy
        if: inputs.fresh_snapshot
        env:
          # a service principal with CAN_MANAGE_RUN on the snapshot job (databricks.yml)
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          test -n "$DATABRICKS_CLIENT_SECRET" || { echo "::error::DATABRICKS_CLIENT_SECRET is not set (see README: Publish changes)"; exit 1; }
          uv run --no-project --with databricks-sdk python scripts/fresh_snapshot.py start
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore caches (FieldMaps COD-AB, Natural Earth, framework document texts)
        uses: actions/cache@v4
        with:
          path: |
            data/fieldmaps
            data/world
            data/framework_documents
          key: geo-${{ github.run_id }}
          restore-keys: geo-
      - name: "Restore the Media page's photo renditions (named by content: a cache never goes stale)"
        uses: actions/cache@v4
        with:
          path: site_media
          key: media-${{ hashFiles('site_src/media.json') }}
          restore-keys: media-
      - run: uv sync
      - name: Install graphviz (schema ERD)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz >/dev/null
      - name: Wait for the fresh copy of the database
        if: inputs.fresh_snapshot
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: uv run --no-project --with databricks-sdk python scripts/fresh_snapshot.py wait "${{ steps.copy.outputs.run_id }}"
      - name: Restore the aa schema from the blob snapshot
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          test -n "$DSCI_AZ_BLOB_DEV_SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          uv run python scripts/restore_snapshot.py --snapshot "${{ github.event.inputs.snapshot || 'latest' }}"
      - name: Build, encrypt and stage the site
        env:
          EXTRACT_TOKEN: ${{ secrets.EXTRACT_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # read-only: the Media page's photo renditions (scripts/sync_media.py --fetch), and the
          # framework documents' texts once the open layer publishes them (llm_layer, held for now)
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          # never publish pages without the proxy token: the data-entry and admin pages would go dark
          test -n "$EXTRACT_TOKEN" || { echo "::error::EXTRACT_TOKEN secret is not set"; exit 1; }
          test -n "$SITE_PASSWORD" || { echo "::error::SITE_PASSWORD secret is not set"; exit 1; }
          # the admin site (admin/) has its own password, with no default anywhere
          test -n "$ADMIN_PASSWORD" || { echo "::error::ADMIN_PASSWORD secret is not set (gh secret set ADMIN_PASSWORD)"; exit 1; }
          STAGE=_dev-build bash scripts/publish.sh
      # the open site is built from `prod` (D203): the commit the owner last put live
      # (a pull request's check takes the same path: its merge would publish exactly this)
      - name: Which code builds the open site
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prod=$(git ls-remote --exit-code origin refs/heads/prod | cut -f1)
          # the regex is what fails closed: a step runs without pipefail
          [[ "$prod" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::no prod branch: the open site is built from it (D203; promote.yml creates it)"; exit 1; }
          # prod only ever holds a commit of main (promote.yml): never build the open site from anything else
          cmp() { gh api "repos/$GITHUB_REPOSITORY/compare/$prod...$GITHUB_SHA" --jq .status; }
          rel=$(cmp) || { sleep 10; rel=$(cmp) || rel="unknown (GitHub's API did not answer)"; }
          case "$rel" in identical|ahead) ;; *)
            echo "::error::prod ($prod) is not a commit of this build's history ($rel): move it with promote.yml"; exit 1 ;;
          esac
          echo "prod_sha=$prod" >> "$GITHUB_OUTPUT"
          if [ "$prod" = "$GITHUB_SHA" ]; then echo "open_from=self"; else echo "open_from=prod"; fi >> "$GITHUB_OUTPUT"
      - name: Check out the open site's code (prod)
        if: steps.which.outputs.open_from == 'prod'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.which.outputs.prod_sha }}
          path: _prod
      - name: Build the open site from prod
        if: steps.which.outputs.open_from == 'prod'
        env:
          EXTRACT_TOKEN: ${{ secrets.EXTRACT_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          # the same database (restored above), caches and photos; its own code, scripts and checks
          ln -s "$GITHUB_WORKSPACE/data" _prod/data
          ln -s "$GITHUB_WORKSPACE/site_media" _prod/site_media
          cd _prod && STAGE=_open-build bash scripts/publish.sh
      - name: Put the site together
        env:
          GH_TOKEN: ${{ github.token }}      # the summary's list of pull requests not on the open site yet
          OPEN_FROM: ${{ steps.which.outputs.open_from }}
          PROD_SHA: ${{ steps.which.outputs.prod_sha }}
        run: |
          if [ "$OPEN_FROM" = prod ]; then
            # the open site is checked by the rules of the code that built it (main may have opened or
            # closed a page since): its address list and its list of open pages
            uv run python scripts/assemble_site.py --dev _dev-build --open _prod/_open-build --open-src _prod \
              --out _site --open-sha "$PROD_SHA" --dev-sha "$GITHUB_SHA"
            export OPEN_PAGES_OVERRIDE=$(sed -n 's/^OPEN_PAGES="\(.*\)"$/\1/p' _prod/scripts/publish.sh)
            [ -n "$OPEN_PAGES_OVERRIDE" ] || { echo "::error::no OPEN_PAGES line in prod's publish.sh"; exit 1; }
          else
            uv run python scripts/assemble_site.py --dev _dev-build --open _dev-build \
              --out _site --open-sha "$PROD_SHA" --dev-sha "$GITHUB_SHA"
          fi
          CHECK_ONLY=_site bash scripts/publish.sh          # the published site's rules, on the whole
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # a job of its own: the github-pages environment's branch policy guards the deploy alone
  deploy:
    needs: publish
    # main only: a pull request's check and a branch's build stop at the package (D203)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write       # deploy-pages, this job only
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

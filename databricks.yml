# Databricks Asset Bundle — ONE job: the nightly KB sync + `aa` schema snapshot.
#
# Why Databricks: the dev Postgres server is losing public network access; the
# workspace (private endpoint) is the only thing that will still reach it. The
# job writes a snapshot to the dev blob, and GitHub Actions builds the site from
# that (publish.yml) — so the data plane here is DEV by nature: this job exists
# to move dev-DB content somewhere GitHub can read it.
#
#   databricks bundle validate -t prod -p DEFAULT
#   databricks bundle deploy   -t prod -p DEFAULT
#   databricks bundle run aa_tracking_nightly -t prod -p DEFAULT
#   # one-off schema migration: run with the flag (see databricks/nightly.py)
#   databricks bundle run aa_tracking_nightly -t prod -p DEFAULT \
#       --python-params "--ensure-schema"
#
# Deployment targets follow the team convention (KB infrastructure/databricks.md):
# `dev` = your interactive cluster, unscheduled; `prod` = ephemeral Job Compute
# under the dsci policy (secrets injected), scheduled. "prod" is the *deployment*
# axis only — the data plane is the dev DB + dev blob in both targets.

bundle:
  name: ds-aa-tracking

variables:
  git_branch:
    description: Branch the job pulls the scripts from
    default: main
  existing_cluster_id:
    description: Interactive cluster for the dev target
    default: "0515-161935-i2w5mxhc"

resources:
  jobs:
    aa_tracking_nightly:
      name: AA Tracking Nightly (KB sync + aa snapshot)
      description: >-
        Upserts new knowledge-base framework pages into aa.framework_version, then
        snapshots the whole dev `aa` schema (parquet + DDL) to the dev blob under
        projects/ds-aa-tracking/snapshot/ for the GitHub Actions site build.
      permissions:
        - group_name: dsci
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-aa-tracking.git
        git_provider: gitHub
        git_branch: ${var.git_branch}
      schedule:
        # 03:30 UTC — the GitHub publish workflow restores `latest` at 04:17 UTC
        quartz_cron_expression: "0 30 3 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tags:
        databricks: job
        type: aa-tracking
        output_schema: aa.framework_version,aa.country_hazard,aa.entry_audit
        output_blob: projects/ds-aa-tracking/snapshot
      email_notifications:
        on_failure:
          - tristan.downing@un.org
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: nightly
          timeout_seconds: 3600
          spark_python_task:
            python_file: databricks/nightly.py
            source: GIT
          libraries: &libs
            - pypi: { package: "ocha-stratus" }
            - pypi: { package: "pandas>=2.0" }
            - pypi: { package: "sqlalchemy>=2.0" }
            - pypi: { package: "psycopg2-binary" }
            - pypi: { package: "pyarrow" }
            - pypi: { package: "pyyaml" }
            - pypi: { package: "pycountry" }
            - pypi: { package: "openpyxl" }

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
    resources:
      jobs:
        aa_tracking_nightly:
          schedule:
            pause_status: PAUSED
          tasks:
            - task_key: nightly
              existing_cluster_id: ${var.existing_cluster_id}

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: adm.tdowning@global.un.org
    resources:
      jobs:
        aa_tracking_nightly:
          job_clusters:
            - job_cluster_key: nightly_cluster
              new_cluster:
                # Job Compute policy (000C79D951EAF0D6): ephemeral single-worker
                # cluster with every dsci DB/blob secret injected as env vars.
                # Minimal spec that validates against the policy; spark_version
                # (latest LTS, Python 3.12) and node type come from its defaults.
                policy_id: "000C79D951EAF0D6"
                apply_policy_default_values: true
                num_workers: 1
          tasks:
            - task_key: nightly
              job_cluster_key: nightly_cluster
